name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up FFmpeg (Windows)
      if: runner.os == 'Windows'
      uses: FedericoCarboni/setup-ffmpeg@v3
      with:
        ffmpeg-version: release

    - name: Set up FFmpeg (Linux)
      if: runner.os == 'Linux'
      run: |
        if ! command -v ffmpeg &> /dev/null; then
          sudo apt-get update && sudo apt-get install -y ffmpeg
        fi

    - name: Diagnostic FFmpeg version
      run: ffmpeg -version

    - name: Verify Python compilation
      run: python -m py_compile server.py

    - name: Generate Media Fixtures
      run: python tests/fixtures/make_test_media.py

    - name: Run Test Suite
      shell: bash
      run: |
        python -m unittest discover -s tests -v > test_output.log 2>&1 || TEST_FAILED=1
        cat test_output.log
        if [ "$TEST_FAILED" = "1" ]; then
          grep -B 2 -A 35 -E "^(FAIL|ERROR):" test_output.log | while IFS= read -r line; do
            echo "::error title=Test Failure::$line"
          done
          exit 1
        fi
