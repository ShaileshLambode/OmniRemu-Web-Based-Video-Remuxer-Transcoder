name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up FFmpeg
      uses: FedericoCarboni/setup-ffmpeg@v3
      with:
        ffmpeg-version: release

    - name: Diagnostic FFmpeg version
      run: ffmpeg -version

    - name: Verify Python compilation
      run: python -m py_compile server.py

    - name: Generate Media Fixtures
      run: python tests/fixtures/make_test_media.py

    - name: Run Test Suite
      shell: bash
      run: |
        set +e
        python -m unittest discover -s tests -v > test_output.log 2>&1
        TEST_EXIT=$?
        cat test_output.log
        echo "## Test Output (Exit: $TEST_EXIT)" >> "$GITHUB_STEP_SUMMARY"
        echo '```text' >> "$GITHUB_STEP_SUMMARY"
        cat test_output.log >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        exit $TEST_EXIT
